function L(l) {

  d.s.forEach((s, i) => {

      <div class="sec-title">${s.title}</div>
      ${s.body}

    if (i < d.s.length - 1) {

    }
  });

  document.getElementById('body').innerHTML = html;
  document.getElementById('foot').textContent = d.lang;

}
